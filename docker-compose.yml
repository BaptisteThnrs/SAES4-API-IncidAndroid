services:
  statisalle:
    image: webdevops/php-apache-dev:8.2-alpine
    container_name: statisalle-app
    working_dir: /app/
    ports:
      - 8080:80
    volumes:
      - ./:/app/
  statisalle-db:
    image: mysql:8
    container_name: statisalle-db
    environment:
      - MYSQL_USER=statisalle
      - MYSQL_DATABASE=statisalle
      - MYSQL_PASSWORD=statisalle
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "6612:3306"
    volumes:
      - ./sql/:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8 --collation-server=utf8_general_ci 
